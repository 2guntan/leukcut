  prompt_base: >-
    FLAT 2D animation still, clean vector-like shapes, VERTICAL 9:16 frame,
    consistent with the existing board frames. Dry-season African savanna
    village around a stone well, deep indigo night sky (#1F2A5A to #131A3A),
    rising full moon, warm golden accents. CHARACTERS STRICTLY ON-MODEL -
    LEUK: slim vertical golden hare, white t-shirt with a gold diamond motif,
    olive shorts, white four-point star shape on forehead (star NOT glowing
    unless stated), one straight ear one bent ear. BOUKI: heavy bipedal hyena
    exactly as BOUKI_SELECTED_V01 with WARM BROWN fur #9A7B52, big round belly
    opening a patched terracotta vest, mango-shaped golden spot on right
    shoulder, gentle glutton face, exactly four limbs. Background animals as
    simple dark silhouettes.
  negative_prompt: >-
    green eyes, menacing, Lion King hyena, extra limbs, glowing star,
    3D render, photorealistic, painterly storybook style, cream tunic,
    text, watermark, horizontal frame

