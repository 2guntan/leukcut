[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leukcut"
version = "1.0.0"
description = "Deterministic shot-manifest assembly CLI for Waraba Studios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "Pillow>=10,<13"]

[project.scripts]
leukcut = "leukcut.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

